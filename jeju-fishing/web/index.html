<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5c7a">
  <title>제주 조황 모아보기</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="제주조황">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/feed">제주 조황 모아보기 <span class="tag">가칭</span></a>
  </header>

  <main id="app" aria-live="polite">
    <p class="state">불러오는 중…</p>
  </main>

  <nav class="tabbar" aria-label="주 메뉴">
    <a href="#/feed" data-tab="feed"><span aria-hidden="true">🎣</span>조황</a>
    <a href="#/vessels" data-tab="vessels"><span aria-hidden="true">⚓</span>선사</a>
    <a href="#/favorites" data-tab="favorites"><span aria-hidden="true">★</span>관심</a>
  </nav>

  <dialog id="filter-sheet" class="sheet" aria-labelledby="filter-title">
    <form method="dialog" id="filter-form">
      <div class="sheet-head">
        <h2 id="filter-title">필터</h2>
        <button type="button" class="link" data-action="filter-reset">초기화</button>
      </div>
      <div id="filter-body"></div>
      <div class="sheet-actions">
        <button type="button" class="btn ghost" data-action="filter-close">닫기</button>
        <button type="submit" class="btn primary" value="apply">적용</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
